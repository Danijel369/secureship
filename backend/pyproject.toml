[project]
name = "backend"
version = "0.1.0"
description = "SecureShip backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false